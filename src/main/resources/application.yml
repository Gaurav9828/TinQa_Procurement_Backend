spring:
  application:
    name: tinqa-procurement-backend

  profiles:
    active: dev

server:
  port: 9090

  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers

  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
tinqa:
  cors:
    # Browser origins allowed to call the API (comma-separated)
    allowed-origins: ${TINQA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  super-admin:
    # Bootstrap Admin L2 created at startup if missing. Empty username or password = none (set per environment)
    username: ${TINQA_SUPER_ADMIN_USERNAME:}
    email: ${TINQA_SUPER_ADMIN_EMAIL:}
    password: ${TINQA_SUPER_ADMIN_PASSWORD:}
    first-name: ${TINQA_SUPER_ADMIN_FIRST_NAME:Super}
    last-name: ${TINQA_SUPER_ADMIN_LAST_NAME:Admin}
    phone: ${TINQA_SUPER_ADMIN_PHONE:9000000000}
  employee:
    # Temporary password of every new employee account; it must be changed at first login
    default-password: ${TINQA_EMPLOYEE_DEFAULT_PASSWORD:TinQa}
  internal-api:
    # Shared secret other TinQa services send in X-Internal-Api-Key. Empty = internal API disabled.
    key: ${TINQA_INTERNAL_API_KEY:}
  product-approval:
    # Maker-checker: false = the Admin L2 who submitted a product cannot also approve/reject/cancel it
    allow-self-decision: ${TINQA_PRODUCT_APPROVAL_ALLOW_SELF_DECISION:false}
