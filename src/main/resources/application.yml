spring:
  application:
    name: tinqa-procurement-backend

  profiles:
    active: dev

  jpa:
    properties:
      hibernate:
        # Lazy collections and references load for up to 50 parents in one IN query instead of one query each (N+1)
        default_batch_fetch_size: 50

server:
  port: 9090

  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers

  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
tinqa:
  cors:
    # Browser origins allowed to call the API (comma-separated)
    allowed-origins: ${TINQA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  super-admin:
    # Bootstrap Admin L2 created at startup if missing. Empty username or password = none (set per environment)
    username: ${TINQA_SUPER_ADMIN_USERNAME:}
    email: ${TINQA_SUPER_ADMIN_EMAIL:}
    password: ${TINQA_SUPER_ADMIN_PASSWORD:}
    first-name: ${TINQA_SUPER_ADMIN_FIRST_NAME:Super}
    last-name: ${TINQA_SUPER_ADMIN_LAST_NAME:Admin}
    phone: ${TINQA_SUPER_ADMIN_PHONE:9000000000}
  employee:
    # Temporary password of new dealer logins (changed at first login). Employees get an emailed set-password link instead
    default-password: ${TINQA_EMPLOYEE_DEFAULT_PASSWORD:TinQa}
  internal-api:
    # Shared secret other TinQa services send in X-Internal-Api-Key. Empty = internal API disabled.
    key: ${TINQA_INTERNAL_API_KEY:}
  ecommerce:
    # Staff account emails (verification codes, password links) go out through the e-commerce service's mail
    # server (Company Profile › Email), called with the internal API key above
    base-url: ${TINQA_ECOMMERCE_BASE_URL:http://localhost:8080/api}
  account:
    verification:
      code-validity: 10m
      max-attempts: 5
      resend-cooldown: 60s
      max-codes-per-hour: 5
      token-validity: 30m
    password-link:
      validity: 15m
      resend-cooldown: 60s
  payroll:
    payslip-email:
      # Emails the payslip of each confirmed salary (retried a few times when the mail server fails)
      enabled: ${TINQA_PAYSLIP_EMAIL_ENABLED:true}
      interval-ms: 60000
  product-approval:
    # Maker-checker: false = the Admin L2 who submitted a product cannot also approve/reject/cancel it
    allow-self-decision: ${TINQA_PRODUCT_APPROVAL_ALLOW_SELF_DECISION:false}
