spring:
  application:
    name: tinqa-procurement-backend

  profiles:
    active: dev

server:
  port: 9090

  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers

  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
tinqa:
  internal-api:
    # Shared secret other TinQa services send in X-Internal-Api-Key. Empty = internal API disabled.
    key: ${TINQA_INTERNAL_API_KEY:}
