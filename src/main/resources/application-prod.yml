spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  flyway:
    enabled: true

  # Required, like the database: a missing REDIS_HOST stops startup instead of silently using localhost.
  # Redis holds revoked tokens and the sign-in / password attempt counters.
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${TINQA_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${TINQA_API_DOCS_ENABLED:false}

logging:
  level:
    root: WARN
    com.tinqa.procurement: INFO

tinqa:
  security:
    jwt:
      # Required: the Ed25519 pair tokens are signed with (base64 DER, PKCS#8 private / X.509 public), never committed.
      # Generate: openssl genpkey -algorithm ed25519 -outform DER | base64; the public key is published at
      # GET /api/auth/jwks, so Ecommerce can verify admin tokens but not create them. The old
      # TINQA_SECURITY_JWT_SECRET is no longer read.
      private-key: ${TINQA_SECURITY_JWT_PRIVATE_KEY}
      public-key: ${TINQA_SECURITY_JWT_PUBLIC_KEY}
      expiration: ${TINQA_SECURITY_JWT_EXPIRATION:86400000}
