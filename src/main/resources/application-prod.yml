spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  flyway:
    enabled: true

  # Required, like the database: a missing REDIS_HOST stops startup instead of silently using localhost.
  # Redis holds revoked tokens and the sign-in / password attempt counters.
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${TINQA_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${TINQA_API_DOCS_ENABLED:false}

logging:
  level:
    root: WARN
    com.tinqa.procurement: INFO

tinqa:
  security:
    jwt:
      # Required: at least 32 characters, never committed
      secret: ${TINQA_SECURITY_JWT_SECRET}
      expiration: ${TINQA_SECURITY_JWT_EXPIRATION:86400000}
