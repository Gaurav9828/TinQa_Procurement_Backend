spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.tinqa.procurement: INFO

tinqa:
  security:
    jwt:
      # Required: at least 32 characters, never committed
      secret: ${TINQA_SECURITY_JWT_SECRET}
      expiration: ${TINQA_SECURITY_JWT_EXPIRATION:86400000}
