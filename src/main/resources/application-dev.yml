spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tinqa_procurement
    username: tinqa_app
    password: tinqa_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

logging:
  level:
    root: INFO
    com.tinqa.procurement: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

tinqa:
  employee:
    # Local development only; UAT/PROD must set TINQA_EMPLOYEE_DEFAULT_PASSWORD
    default-password: ${TINQA_EMPLOYEE_DEFAULT_PASSWORD:TinQa}
  internal-api:
    # Local development only; UAT/PROD must set TINQA_INTERNAL_API_KEY
    key: ${TINQA_INTERNAL_API_KEY:dev-internal-api-key-change-me}

  security:
    jwt:
      secret: TinQaDevJwtSecretKeyMustBeAtLeast32CharactersLong!
      expiration: 86400000

  # Local development login (see application.yml); change it in-app or override via TINQA_SUPER_ADMIN_* variables
  super-admin:
    username: ${TINQA_SUPER_ADMIN_USERNAME:superadmin}
    email: ${TINQA_SUPER_ADMIN_EMAIL:superadmin@tinqa.com}
    password: ${TINQA_SUPER_ADMIN_PASSWORD:TinQa@SuperAdmin2026}
