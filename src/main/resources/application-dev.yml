spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tinqa_procurement
    username: tinqa_app
    password: tinqa_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

logging:
  level:
    root: INFO
    com.tinqa.procurement: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

tinqa:
  security:
    jwt:
      secret: TinQaDevJwtSecretKeyMustBeAtLeast32CharactersLong!
      expiration: 86400000

  initial-admin:
    username: admin
    email: admin@tinqa.com
    password: 12345