# Profile for the full-application test suite. Datasource and Redis come from Testcontainers (@ServiceConnection).
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.tinqa.procurement: INFO

# Per-endpoint SQL statistics for the quality gate's API budget check
monitoring:
  api:
    report-file: target/quality/api-calls.tsv

file:
  upload-dir: target/test-uploads

tinqa:
  employee:
    default-password: TinQa
  internal-api:
    key: test-internal-api-key

  # Tests send due payslips themselves (PayslipEmailSender.sendDue)
  payroll:
    payslip-email:
      enabled: false

  # Tests run the outreach reminders and meeting emails themselves (OutreachFollowUpReminder, MeetingMailer)
  outreach:
    follow-up-reminder:
      enabled: false
  meetings:
    jobs:
      enabled: false

  security:
    jwt:
      secret: TinQaTestJwtSecretKeyMustBeAtLeast32CharactersLong!
      expiration: 3600000

  super-admin:
    username: test-superadmin
    email: test-superadmin@tinqa.test
    password: Test@SuperAdmin2026
    phone: 9000000099
