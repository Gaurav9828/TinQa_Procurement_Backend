# Every pull request and every push to main runs the full test suite and the quality gate (quality/QualityGate.java):
# unit and integration tests (Testcontainers PostgreSQL and Redis), coverage, SpotBugs/FindSecBugs, PMD, secret and
# dependency scans, and the API query budgets. The same command works locally: mvn -B package
name: CI

on:
  pull_request:
  push:
    # Feature branches too, so a pushed branch is checked before its pull request
    branches: [main, UAT, 'Feature/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the gate measures new-code coverage against the merge base with UAT / main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests and quality gate
        run: mvn -B package

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-quality-reports
          path: |
            target/surefire-reports
            target/site/jacoco
            target/quality
          if-no-files-found: ignore
