# Local quality gate settings (see quality/QualityGate.java)

# Minimum line coverage when tests run (JaCoCo). Raise it as coverage improves.
coverage.minLinePercent=85

# The lines changed since the base branch (first ref of newCode.baseRefs that exists) must be this well covered by
# tests: a warning in local builds, a failure in strict (UAT/production) builds. New code ships with its tests.
coverage.minNewCodePercent=80
newCode.baseRefs=origin/UAT,UAT,origin/main,main

# Dependency vulnerabilities (OSV.dev) at these severities fail the build unless accepted below.
# Strict (UAT/production) builds also fail on unaccepted moderate ones.
dependencies.failOn=critical,high
dependencies.timeoutSeconds=60
# Accept an advisory until a date: dependencies.allow.<GHSA or CVE id>=<YYYY-MM-DD or empty>|<reason>
# dependencies.allow.GHSA-xxxx-xxxx-xxxx=2026-12-31|Not reachable: we never call the affected API
# Spring 6.2.19 is the last open-source 6.2 release; these are fixed only in Spring 7 (Spring Boot 4). Re-check by the date.
dependencies.allow.GHSA-pc63-qcmh-9cmg=2027-01-31|Not reachable: no XsltView is used (fixed only in Spring 7 / Boot 4)
dependencies.allow.GHSA-j9f9-w8pj-32f8=2027-01-31|Not reachable: no SSE fragment rendering is used (fixed only in Spring 7 / Boot 4)

# Secrets found in these files are warnings (local/dev/test only); anywhere else they are errors.
# Neither stops a local build; a strict one (mvn package -Dquality.strict=true) fails on both, except fixtures under src/test
secrets.localOnlyPaths=(^|/)src/test/|application-(dev|local|test)[^/]*\\.(ya?ml|properties)$|(^|/)\\.env\\.(dev|local)$|(^|/)docker-compose[^/]*\\.ya?ml$
secrets.ignorePaths=^quality/|^target/|^\\.idea/|^\\.ai/|^\\.readme/
